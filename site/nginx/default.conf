# ManaResto — site vitrine (statique) derrière Traefik. Monté en dossier (site/nginx → conf.d) : chaque déploiement est pris en compte. Le formulaire de démonstration est relayé à l'application.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  # Redirections relatives (« Location: / ») : nginx est derrière Traefik en HTTP, une adresse absolue
  # partirait en http:// et coûterait un détour de plus
  absolute_redirect off;

  gzip on;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # HTTPS imposé au navigateur (le site est toujours servi en HTTPS par Traefik)
  add_header Strict-Transport-Security "max-age=31536000" always;

  # Page introuvable : vraie réponse 404 (Google n'indexe pas les adresses mortes) avec une page utile
  error_page 404 /404.html;
  location = /404.html { internal; expires epoch; }

  location ^~ /nginx/ { return 404; }
  # Une seule adresse pour l'accueil (évite le contenu en double dans Google)
  # (l'accueil « / » passe en interne par /index.html : seule l'adresse tapée est redirigée)
  location = /index.html { if ($request_uri ~ ^/index\.html) { return 301 /; } expires epoch; }
  location = /index { return 301 /; }
  location = /404 { return 404; }
  location = /README.md { return 404; }

  # Demande de démonstration → application (même réseau Docker « traefik », conteneur « manaresto »).
  # Résolution DNS Docker à chaque requête : l'adresse de l'application change quand son conteneur est recréé.
  resolver 127.0.0.11 valid=10s ipv6=off;
  location = /api/demo {
    set $demo_upstream http://manaresto:3000/api/public/demo-request;
    proxy_pass $demo_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 64k;
  }

  # Mesure d'audience anonyme (sans cookie) → application
  location = /api/t {
    set $visit_upstream http://manaresto:3000/api/public/visit;
    proxy_pass $visit_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 4k;
  }

  # Images, vidéo et polices : cache long (changer le ?v= ou le nom du fichier à chaque mise à jour)
  # (un add_header dans un bloc location remplace ceux du serveur : les en-têtes de sécurité sont répétés)
  location ~* \.(webp|png|jpg|jpeg|svg|ico|woff2|mp4)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;
  }
  # Styles et scripts (noms fixes) : courte durée pour que les mises à jour du site soient visibles vite
  location ~* \.(css|js)$ { expires 5m; }

  # Anciennes adresses .html → adresses propres
  location ~ ^/(mentions-legales|confidentialite|conditions|demo)\.html$ { return 301 /$1; }

  # Adresse de partage d'un restaurant (manaresto.com/le-mana-beach) : une page du site vitrine si elle existe
  # (/demo, /conditions…), sinon le site du restaurant servi par l'application (/r/<adresse>), sans changer l'adresse
  # affichée. Restaurant inconnu : la page 404 du site vitrine.
  # (majuscules acceptées : manaresto.com/Chez-Hina mène au même restaurant)
  location ~* "^/(?<share>[a-z0-9]+(?:-[a-z0-9]+)*)/?$" {
    expires epoch;
    try_files $uri $uri.html @restaurant;
  }
  location @restaurant {
    set $restaurant_upstream http://manaresto:3000/r/$share$is_args$args;
    proxy_pass $restaurant_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_intercept_errors on;
  }
  # Scripts, styles, polices, logo et icônes de l'application utilisés par ces pages (mêmes fichiers que sur app.manaresto.com)
  location ^~ /_next/ { set $app_file http://manaresto:3000$request_uri; proxy_pass $app_file; proxy_set_header Host $host; }
  location ^~ /brand/ { set $app_file http://manaresto:3000$request_uri; proxy_pass $app_file; proxy_set_header Host $host; }
  location ^~ /fonts/ { set $app_file http://manaresto:3000$request_uri; proxy_pass $app_file; proxy_set_header Host $host; }
  location ^~ /icons/ { set $app_file http://manaresto:3000$request_uri; proxy_pass $app_file; proxy_set_header Host $host; }
  # Rapports d'erreurs envoyés par ces pages (tunnel de suivi des erreurs de l'application)
  location = /monitoring { set $app_file http://manaresto:3000$request_uri; proxy_pass $app_file; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; client_max_body_size 1m; }

  # Pages : toujours revalidées (textes de l'offre à jour dès le déploiement)
  location / { expires epoch; try_files $uri $uri.html $uri/ =404; }
}
