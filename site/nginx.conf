# ManaResto — site vitrine (statique) derrière Traefik. Le formulaire de démonstration est relayé à l'application.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  gzip on;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /nginx.conf { return 404; }
  location = /README.md { return 404; }

  # Demande de démonstration → application (même réseau Docker « traefik », conteneur « manaresto »)
  location = /api/demo {
    proxy_pass http://manaresto:3000/api/public/demo-request;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 64k;
  }

  # Images et polices : cache long
  location ~* \.(webp|png|jpg|jpeg|svg|ico|woff2)$ { expires 30d; add_header Cache-Control "public, max-age=2592000, immutable"; }
  # Styles et scripts (noms fixes) : courte durée pour que les mises à jour du site soient visibles vite
  location ~* \.(css|js)$ { expires 5m; }

  # Anciennes adresses .html → adresses propres
  location ~ ^/(mentions-legales|confidentialite|conditions)\.html$ { return 301 /$1; }

  # Pages : toujours revalidées (textes de l'offre à jour dès le déploiement)
  location / { expires epoch; try_files $uri $uri.html $uri/ =404; }
}
