  db:
    image: postgres:16-alpine
    container_name: __APP_NAME__-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: __APP_NAME__
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: __APP_NAME__
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - __APP_NAME__-pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U __APP_NAME__"]
      interval: 10s
      timeout: 5s
      retries: 5
