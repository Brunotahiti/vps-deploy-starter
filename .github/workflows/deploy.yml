name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps-manaresto
  cancel-in-progress: false

jobs:
  check:
    name: Secrets configurés ?
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.c.outputs.configured }}
    steps:
      - id: c
        run: |
          if [ -n "${{ secrets.VPS_SSH_KEY }}" ] && [ -n "${{ secrets.VPS_HOST }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Déploiement ignoré : secrets VPS non configurés (lancer scripts/setup-ci.sh une fois)."
          fi

  deploy:
    name: SSH → VPS rebuild
    needs: check
    if: needs.check.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Sync code to VPS
        run: |
          rsync -avz --delete \
            --exclude node_modules \
            --exclude .next \
            --exclude src/generated \
            --exclude playwright-report \
            --exclude test-results \
            --exclude .git \
            --exclude .github \
            --exclude .vercel \
            --exclude .env \
            --exclude .env.local \
            --exclude .env.production \
            --exclude .DS_Store \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PATH }}/

      - name: Rebuild & restart on VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} <<'EOF'
            set -e
            cd ${{ secrets.VPS_PATH }}
            if [ -f .env ]; then set -a && source .env && set +a; fi
            docker network create traefik 2>/dev/null || true
            docker compose build migrate app
            docker compose up -d
            docker image prune -f
            docker compose ps
          EOF

      - name: Verify health
        run: |
          sleep 8
          STATUS=$(curl -fsS -o /dev/null -w "%{http_code}\n" "https://${{ secrets.PUBLIC_HOST }}/api/health" || echo "000")
          echo "→ HTTP status: $STATUS"
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "302" ] || [ "$STATUS" = "301" ]; then
            echo "✅ App reachable on https://${{ secrets.PUBLIC_HOST }}"
          else
            echo "⚠️  Status $STATUS — vérifie les logs du container"
          fi
