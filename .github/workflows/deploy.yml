name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps-manaresto
  cancel-in-progress: false

# Jeton GitHub en lecture seule : les jobs n'écrivent rien dans le dépôt
permissions:
  contents: read

jobs:
  check:
    name: Secrets configurés ?
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.c.outputs.configured }}
    steps:
      - id: c
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          VPATH: ${{ secrets.VPS_PATH }}
        run: |
          # Les QUATRE secrets sont obligatoires : sans VPS_PATH, rsync --delete viserait la racine du serveur
          if [ -n "$KEY" ] && [ -n "$HOST" ] && [ -n "$USER" ] && [ -n "$VPATH" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Déploiement ignoré : secrets VPS incomplets (VPS_SSH_KEY, VPS_HOST, VPS_USER, VPS_PATH ; lancer scripts/setup-ci.sh une fois)."
          fi

  test:
    name: Tests avant mise en ligne
    needs: check
    if: needs.check.outputs.configured == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: manaresto_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/manaresto
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/manaresto_test
      SESSION_SECRET: ci-secret-0123456789-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm next build

  deploy:
    name: SSH → VPS rebuild
    # Rien n'est envoyé sur le serveur si un test échoue
    needs: [check, test]
    if: needs.check.outputs.configured == 'true'
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PATH: ${{ secrets.VPS_PATH }}
      PUBLIC_HOST: ${{ secrets.PUBLIC_HOST }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Garde-fou du dossier de destination
        run: |
          # rsync --delete ne doit JAMAIS viser autre chose que le dossier de l'application (/opt/<nom>)
          case "${VPS_PATH:?VPS_PATH manquant}" in
            /opt/?*) ;;
            *) echo "::error::VPS_PATH doit être un dossier sous /opt (reçu : '$VPS_PATH')"; exit 1 ;;
          esac

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          # Serveur parfois lent à répondre (juste après un déploiement) : plusieurs essais avant d'abandonner
          for i in 1 2 3 4 5; do
            if ssh-keyscan -T 15 -H "$VPS_HOST" > /tmp/vps_keys 2>/dev/null && [ -s /tmp/vps_keys ]; then cat /tmp/vps_keys >> ~/.ssh/known_hosts; exit 0; fi
            echo "→ essai $i : le serveur ne répond pas encore"; sleep $((i * 5))
          done
          echo "::error::Le serveur $VPS_HOST ne répond pas en SSH"; exit 1

      - name: Sync code to VPS
        run: |
          rsync -avz --delete \
            --exclude node_modules \
            --exclude .next \
            --exclude src/generated \
            --exclude playwright-report \
            --exclude test-results \
            --exclude .git \
            --exclude .github \
            --exclude .vercel \
            --exclude .env \
            --exclude .env.local \
            --exclude .env.production \
            --exclude .DS_Store \
            ./ "$VPS_USER@$VPS_HOST:${VPS_PATH%/}/"

      - name: Rebuild & restart on VPS
        run: |
          # Connexion entretenue : les migrations et la démo peuvent durer plusieurs minutes sans rien afficher
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$VPS_USER@$VPS_HOST" "VPS_PATH='${VPS_PATH%/}' BUILD_ID='$(echo "$GITHUB_SHA" | cut -c1-12)' bash -s" <<'EOF'
            set -e
            cd "$VPS_PATH"
            # Constater, ne jamais modifier : le réseau et le Traefik du serveur doivent exister (voir scripts/vps-bootstrap.sh)
            docker network inspect traefik >/dev/null 2>&1 || { echo "Réseau Docker « traefik » absent : déploiement interrompu"; exit 1; }
            # Notifications push « plat prêt » : clés VAPID (courbe P-256) générées une fois si le .env n'en a pas
            if [ -f .env ] && ! grep -q '^VAPID_PRIVATE_KEY=.\+' .env; then
              K=$(mktemp) && openssl ecparam -genkey -name prime256v1 -noout -out "$K"
              PUB=$(openssl ec -in "$K" -pubout -outform DER 2>/dev/null | tail -c 65 | base64 | tr -d '\n=' | tr '+/' '-_')
              PRIV=$(openssl ec -in "$K" -outform DER 2>/dev/null | head -c 39 | tail -c 32 | base64 | tr -d '\n=' | tr '+/' '-_')
              rm -f "$K"
              sed -i '/^#\? \?VAPID_PUBLIC_KEY=/d; /^#\? \?VAPID_PRIVATE_KEY=/d; /^#\? \?VAPID_SUBJECT=/d' .env
              printf '\nVAPID_PUBLIC_KEY=%s\nVAPID_PRIVATE_KEY=%s\nVAPID_SUBJECT=mailto:contact@manaresto.com\n' "$PUB" "$PRIV" >> .env
              echo "Clés VAPID générées (notifications push)"
            fi
            if [ -f .env ]; then set -a && . ./.env && set +a; fi
            export BUILD_ID
            # Version des styles/scripts du site vitrine = commit déployé
            sed -i -E "s/\.(css|js)\?v=[A-Za-z0-9]+/.\1?v=$BUILD_ID/g" site/*.html 2>/dev/null || true
            # Sauvegarde de la base avant toute migration (la copie hors serveur ne doit pas bloquer un déploiement)
            # Le script lui-même arrive par l'entrée standard (bash -s) : toute commande qui la lit avalerait la suite.
            # D'où « < /dev/null » sur chaque commande susceptible de la lire (docker compose run/exec, scripts).
            if docker ps --format '{{.Names}}' | grep -qx "${APP_NAME:-manaresto}-db"; then SKIP_REMOTE=1 bash scripts/db-backup.sh < /dev/null; fi
            # Version en service conservée sous l'étiquette « previous » : retour arrière possible si la nouvelle ne répond pas
            for img in "${APP_NAME:-manaresto}" "${APP_NAME:-manaresto}-migrate"; do
              if docker image inspect "$img:latest" >/dev/null 2>&1; then docker tag "$img:latest" "$img:previous"; fi
            done
            docker compose build migrate app
            # Le rafraîchissement horaire de la démo et le déploiement ne tournent jamais en même temps (même verrou)
            LOCK=""; CRON_LOCK=""; if command -v flock >/dev/null 2>&1; then LOCK="flock -w 900 /tmp/manaresto-demo.lock"; CRON_LOCK="flock -n /tmp/manaresto-demo.lock"; fi
            echo "Migrations et démarrage…"
            $LOCK docker compose up -d
            # Site vitrine : nouvelle configuration nginx prise en compte (vérifiée avant rechargement)
            if docker compose exec -T site nginx -t < /dev/null >/dev/null 2>&1; then
              if docker compose exec -T site nginx -s reload < /dev/null >/dev/null 2>&1; then echo "Site vitrine : configuration rechargée"; else echo "::warning::Rechargement du site vitrine impossible"; fi
            else
              echo "::warning::Configuration nginx du site vitrine invalide : ancienne configuration conservée"
              docker compose exec -T site nginx -t < /dev/null 2>&1 | tail -3 || true
            fi
            # Démo vivante rafraîchie une fois l'application en ligne (elle ne retarde plus la remise en service)
            if [ "${SEED_DEMO:-}" = "true" ]; then
              echo "Rafraîchissement de la démo…"
              $LOCK docker compose run --rm --no-deps -T migrate pnpm tsx prisma/seed.ts < /dev/null || echo "::warning::Rafraîchissement de la démo en échec (l'application reste en ligne)"
            fi
            # Tâches planifiées de ManaResto (seules ses lignes de la crontab sont réécrites) :
            # sauvegarde quotidienne à 3 h heure de Tahiti, et démo vivante rafraîchie chaque heure si SEED_DEMO=true
            CRON_BACKUP="0 13 * * * $VPS_PATH/scripts/db-backup.sh >> /var/log/manaresto-backup.log 2>&1"
            CRON_DEMO="17 * * * * cd $VPS_PATH && $CRON_LOCK docker compose run --rm --no-deps -T migrate pnpm tsx prisma/seed.ts >> /var/log/manaresto-demo.log 2>&1"
            (crontab -l 2>/dev/null | grep -v "$VPS_PATH/scripts/db-backup.sh" | grep -v "manaresto-demo.log"; echo "$CRON_BACKUP"; if [ "${SEED_DEMO:-}" = "true" ]; then echo "$CRON_DEMO"; fi) | crontab -
            docker image prune -f
            # Cache de construction : l'application est construite sur le serveur, il grossit à chaque déploiement
            docker builder prune -f --filter until=168h >/dev/null
            docker compose ps
            echo "Déploiement sur le serveur terminé"
          EOF

      - name: Verify health
        id: health
        run: |
          if [ -z "$PUBLIC_HOST" ]; then echo "::notice::Secret PUBLIC_HOST absent : vérification ignorée"; exit 0; fi
          for i in 1 2 3 4 5 6; do
            sleep 10
            STATUS=$(curl -sS -o /dev/null -w "%{http_code}" "https://$PUBLIC_HOST/api/health" || echo "000")
            echo "→ essai $i : HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then echo "✅ Application en ligne sur https://$PUBLIC_HOST"; exit 0; fi
          done
          echo "::error::L'application ne répond pas 200 sur https://$PUBLIC_HOST/api/health"
          exit 1

      - name: Retour à la version précédente si l'application ne répond pas
        if: failure() && steps.health.outcome == 'failure'
        run: |
          echo "::warning::La nouvelle version ne répond pas : remise en service de la précédente"
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$VPS_USER@$VPS_HOST" "VPS_PATH='${VPS_PATH%/}' bash -s" <<'EOF'
            set -e
            cd "$VPS_PATH"
            if [ -f .env ]; then set -a && . ./.env && set +a; fi
            APP="${APP_NAME:-manaresto}"
            docker image inspect "$APP:previous" >/dev/null 2>&1 || { echo "Aucune version précédente disponible"; exit 1; }
            # Les migrations ne font qu'ajouter des tables et colonnes : l'ancienne version fonctionne avec la base à jour
            docker tag "$APP:previous" "$APP:latest"
            docker compose up -d --no-build --no-deps app
            docker compose ps app
          EOF
          for i in 1 2 3 4 5 6; do
            sleep 10
            STATUS=$(curl -sS -o /dev/null -w "%{http_code}" "https://$PUBLIC_HOST/api/health" || echo "000")
            echo "→ essai $i : HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then echo "::error::Déploiement annulé : la version précédente est de nouveau en ligne. Corrigez puis redéployez."; exit 1; fi
          done
          echo "::error::Ni la nouvelle ni la précédente version ne répondent : intervention nécessaire (docker compose logs app)"
          exit 1
