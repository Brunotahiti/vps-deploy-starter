name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps-manaresto
  cancel-in-progress: false

jobs:
  check:
    name: Secrets configurés ?
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.c.outputs.configured }}
    steps:
      - id: c
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          VPATH: ${{ secrets.VPS_PATH }}
        run: |
          # Les QUATRE secrets sont obligatoires : sans VPS_PATH, rsync --delete viserait la racine du serveur
          if [ -n "$KEY" ] && [ -n "$HOST" ] && [ -n "$USER" ] && [ -n "$VPATH" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Déploiement ignoré : secrets VPS incomplets (VPS_SSH_KEY, VPS_HOST, VPS_USER, VPS_PATH ; lancer scripts/setup-ci.sh une fois)."
          fi

  deploy:
    name: SSH → VPS rebuild
    needs: check
    if: needs.check.outputs.configured == 'true'
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PATH: ${{ secrets.VPS_PATH }}
      PUBLIC_HOST: ${{ secrets.PUBLIC_HOST }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Garde-fou du dossier de destination
        run: |
          # rsync --delete ne doit JAMAIS viser autre chose que le dossier de l'application (/opt/<nom>)
          case "${VPS_PATH:?VPS_PATH manquant}" in
            /opt/?*) ;;
            *) echo "::error::VPS_PATH doit être un dossier sous /opt (reçu : '$VPS_PATH')"; exit 1 ;;
          esac

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Sync code to VPS
        run: |
          rsync -avz --delete \
            --exclude node_modules \
            --exclude .next \
            --exclude src/generated \
            --exclude playwright-report \
            --exclude test-results \
            --exclude .git \
            --exclude .github \
            --exclude .vercel \
            --exclude .env \
            --exclude .env.local \
            --exclude .env.production \
            --exclude .DS_Store \
            ./ "$VPS_USER@$VPS_HOST:${VPS_PATH%/}/"

      - name: Rebuild & restart on VPS
        run: |
          ssh "$VPS_USER@$VPS_HOST" "VPS_PATH='${VPS_PATH%/}' BUILD_ID='$(echo "$GITHUB_SHA" | cut -c1-12)' bash -s" <<'EOF'
            set -e
            cd "$VPS_PATH"
            # Constater, ne jamais modifier : le réseau et le Traefik du serveur doivent exister (voir scripts/vps-bootstrap.sh)
            docker network inspect traefik >/dev/null 2>&1 || { echo "Réseau Docker « traefik » absent : déploiement interrompu"; exit 1; }
            if [ -f .env ]; then set -a && . ./.env && set +a; fi
            export BUILD_ID
            # Version des styles/scripts du site vitrine = commit déployé
            sed -i -E "s/\.(css|js)\?v=[A-Za-z0-9]+/.\1?v=$BUILD_ID/g" site/*.html 2>/dev/null || true
            # Sauvegarde de la base avant toute migration
            if docker ps --format '{{.Names}}' | grep -qx "${APP_NAME:-manaresto}-db"; then bash scripts/db-backup.sh; fi
            docker compose build migrate app
            docker compose up -d
            (docker compose exec -T site nginx -s reload >/dev/null 2>&1 || true)
            # Tâches planifiées de ManaResto (seules ses lignes de la crontab sont réécrites) :
            # sauvegarde quotidienne à 3 h heure de Tahiti, et démo vivante rafraîchie chaque heure si SEED_DEMO=true
            CRON_BACKUP="0 13 * * * $VPS_PATH/scripts/db-backup.sh >> /var/log/manaresto-backup.log 2>&1"
            CRON_DEMO="17 * * * * cd $VPS_PATH && docker compose run --rm --no-deps -T migrate pnpm tsx prisma/seed.ts >> /var/log/manaresto-demo.log 2>&1"
            (crontab -l 2>/dev/null | grep -v "$VPS_PATH/scripts/db-backup.sh" | grep -v "manaresto-demo.log"; echo "$CRON_BACKUP"; if [ "${SEED_DEMO:-}" = "true" ]; then echo "$CRON_DEMO"; fi) | crontab -
            docker image prune -f
            # Cache de construction : l'application est construite sur le serveur, il grossit à chaque déploiement
            docker builder prune -f --filter until=168h >/dev/null
            docker compose ps
          EOF

      - name: Verify health
        run: |
          if [ -z "$PUBLIC_HOST" ]; then echo "::notice::Secret PUBLIC_HOST absent : vérification ignorée"; exit 0; fi
          for i in 1 2 3 4 5 6; do
            sleep 10
            STATUS=$(curl -sS -o /dev/null -w "%{http_code}" "https://$PUBLIC_HOST/api/health" || echo "000")
            echo "→ essai $i : HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then echo "✅ Application en ligne sur https://$PUBLIC_HOST"; exit 0; fi
          done
          echo "::error::L'application ne répond pas 200 sur https://$PUBLIC_HOST/api/health"
          exit 1
