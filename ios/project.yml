# Projet Xcode de l'app iOS ManaResto, généré par XcodeGen (https://github.com/yonaskolb/XcodeGen).
# Sur le Mac :  brew install xcodegen  puis  cd ios && xcodegen  → ouvre ManaResto.xcodeproj dans Xcode.
name: ManaResto
options:
  bundleIdPrefix: com.manaresto
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Renseignez votre Team ID Apple (10 caractères) ici ou dans Xcode → Signing & Capabilities
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  ManaResto:
    type: application
    platform: iOS
    sources:
      - path: ManaResto
        excludes:
          - Resources/PrivacyInfo.xcprivacy
          - ManaResto.entitlements
      - path: ManaResto/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manaresto.caisse
        PRODUCT_NAME: ManaResto
        # Notifications « plat prêt » (APNs) : capacité Push Notifications
        CODE_SIGN_ENTITLEMENTS: ManaResto/ManaResto.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ManaResto
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSHumanReadableCopyright: "© ManaResto"
  ManaRestoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ManaRestoTests
        excludes:
          - Fixtures
      - path: ManaRestoTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: ManaResto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manaresto.caisse.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ManaResto.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ManaResto"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  ManaResto:
    build:
      targets:
        ManaResto: all
        ManaRestoTests: [test]
    test:
      targets:
        - ManaRestoTests
      gatherCoverageData: false
