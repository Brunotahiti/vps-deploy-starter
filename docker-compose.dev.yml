# Développement local (Mac / PC) : uniquement PostgreSQL 16, l'application tourne avec `pnpm dev`.
# Usage : docker compose -f docker-compose.dev.yml up -d
services:
  db:
    image: postgres:16-alpine
    container_name: manaresto-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: manaresto
    ports:
      - "5432:5432"
    volumes:
      - manaresto-dev-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  manaresto-dev-pgdata:
