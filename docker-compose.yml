# ManaResto — déploiement VPS (Hostinger) : Traefik (externe) + app + Postgres 16
# Variables lues depuis .env : APP_NAME, PUBLIC_HOST, POSTGRES_PASSWORD, SESSION_SECRET, SEED_DEMO…
# Limites mémoire (serveur partagé) : DB_MEM_LIMIT, MIGRATE_MEM_LIMIT, APP_MEM_LIMIT — ajustables dans .env
services:
  db:
    image: postgres:16-alpine
    container_name: ${APP_NAME:-manaresto}-db
    restart: unless-stopped
    mem_limit: ${DB_MEM_LIMIT:-512m}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-manaresto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
      POSTGRES_DB: ${POSTGRES_DB:-manaresto}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-manaresto} -d ${POSTGRES_DB:-manaresto}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    image: ${APP_NAME:-manaresto}-migrate:latest
    container_name: ${APP_NAME:-manaresto}-migrate
    restart: "no"
    mem_limit: ${MIGRATE_MEM_LIMIT:-512m}
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-manaresto}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-manaresto}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        BUILD_ID: ${BUILD_ID:-}
    image: ${APP_NAME:-manaresto}:latest
    container_name: ${APP_NAME:-manaresto}
    restart: unless-stopped
    mem_limit: ${APP_MEM_LIMIT:-768m}
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-manaresto}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-manaresto}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - traefik
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.${APP_NAME:-manaresto}-http.rule=Host(`${PUBLIC_HOST}`)"
      - "traefik.http.routers.${APP_NAME:-manaresto}-http.entrypoints=web"
      - "traefik.http.routers.${APP_NAME:-manaresto}-http.middlewares=${APP_NAME:-manaresto}-https-redirect"
      - "traefik.http.middlewares.${APP_NAME:-manaresto}-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.${APP_NAME:-manaresto}-https-redirect.redirectscheme.permanent=true"
      - "traefik.http.routers.${APP_NAME:-manaresto}.rule=Host(`${PUBLIC_HOST}`)"
      - "traefik.http.routers.${APP_NAME:-manaresto}.entrypoints=websecure"
      - "traefik.http.routers.${APP_NAME:-manaresto}.tls=true"
      - "traefik.http.routers.${APP_NAME:-manaresto}.tls.certresolver=letsencrypt"
      - "traefik.http.services.${APP_NAME:-manaresto}.loadbalancer.server.port=3000"
      # Flux SSE : pas de mise en tampon, délais longs
      - "traefik.http.routers.${APP_NAME:-manaresto}.middlewares=${APP_NAME:-manaresto}-headers"
      - "traefik.http.middlewares.${APP_NAME:-manaresto}-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.${APP_NAME:-manaresto}-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.${APP_NAME:-manaresto}-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.${APP_NAME:-manaresto}-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.${APP_NAME:-manaresto}-headers.headers.referrerPolicy=strict-origin-when-cross-origin"

  # Optionnel (plusieurs instances de l'application) : docker compose --profile redis up -d
  redis:
    image: redis:7-alpine
    container_name: ${APP_NAME:-manaresto}-redis
    restart: unless-stopped
    profiles: ["redis"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - internal
    mem_limit: ${REDIS_MEM_LIMIT:-128m}

networks:
  traefik:
    external: true
    name: traefik
  internal:
    driver: bridge

volumes:
  pgdata:
