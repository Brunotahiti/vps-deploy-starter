# ManaResto — déploiement VPS (Hostinger) : Traefik (externe) + app + Postgres 16
# Variables lues depuis .env : APP_NAME, PUBLIC_HOST, POSTGRES_PASSWORD, SESSION_SECRET, SEED_DEMO…
# Limites mémoire (serveur partagé) : DB_MEM_LIMIT, MIGRATE_MEM_LIMIT, APP_MEM_LIMIT — ajustables dans .env.
# Chaque programme est réglé pour tenir DANS sa limite (sinon le conteneur serait coupé net par le système) :
# Node.js plafonne sa mémoire (APP_HEAP_MB, MIGRATE_HEAP_MB ≈ 2/3 de la limite), PostgreSQL ses caches (DB_SHARED_BUFFERS…).
# Journaux Docker plafonnés (serveur partagé : ils ne doivent jamais remplir le disque)
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    container_name: ${APP_NAME:-manaresto}-db
    restart: unless-stopped
    logging: *logging
    mem_limit: ${DB_MEM_LIMIT:-512m}
    # Réglages calés sur 512 Mo (les valeurs par défaut de PostgreSQL supposent une machine sans limite) :
    # cache partagé ¼, mémoire par tri modérée, connexions plafonnées (application 10 + démo 20 + sauvegarde)
    command:
      - postgres
      - -c
      - shared_buffers=${DB_SHARED_BUFFERS:-128MB}
      - -c
      - effective_cache_size=${DB_EFFECTIVE_CACHE_SIZE:-320MB}
      - -c
      - work_mem=${DB_WORK_MEM:-4MB}
      - -c
      - maintenance_work_mem=${DB_MAINTENANCE_WORK_MEM:-32MB}
      - -c
      - max_connections=${DB_MAX_CONNECTIONS:-40}
      - -c
      - max_parallel_workers_per_gather=1
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-manaresto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
      POSTGRES_DB: ${POSTGRES_DB:-manaresto}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-manaresto} -d ${POSTGRES_DB:-manaresto}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    image: ${APP_NAME:-manaresto}-migrate:latest
    container_name: ${APP_NAME:-manaresto}-migrate
    restart: "no"
    logging: *logging
    mem_limit: ${MIGRATE_MEM_LIMIT:-512m}
    # Priorité basse face à l'application : le rafraîchissement horaire de la démo ne doit pas ralentir le service
    cpu_shares: 256
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-manaresto}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-manaresto}
      # Mémoire de Node.js sous la limite du conteneur (migrations, rafraîchissement de la démo)
      NODE_OPTIONS: --max-old-space-size=${MIGRATE_HEAP_MB:-320}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        BUILD_ID: ${BUILD_ID:-}
        SENTRY_DSN: ${SENTRY_DSN:-}
        SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
    image: ${APP_NAME:-manaresto}:latest
    container_name: ${APP_NAME:-manaresto}
    restart: unless-stopped
    logging: *logging
    mem_limit: ${APP_MEM_LIMIT:-768m}
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-manaresto}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-manaresto}
      PORT: 3000
      # Mémoire de Node.js : ≈ 2/3 de APP_MEM_LIMIT, le reste pour le code, les tampons et les images.
      # Le ramasse-miettes travaille avant d'atteindre la limite au lieu que le conteneur soit coupé net.
      NODE_OPTIONS: --max-old-space-size=${APP_HEAP_MB:-512}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - traefik
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.${APP_NAME:-manaresto}-http.rule=Host(`${PUBLIC_HOST}`) || Host(`${PUBLIC_HOST_ALT:-${PUBLIC_HOST}}`)"
      - "traefik.http.routers.${APP_NAME:-manaresto}-http.entrypoints=web"
      - "traefik.http.routers.${APP_NAME:-manaresto}-http.middlewares=${APP_NAME:-manaresto}-https-redirect"
      - "traefik.http.middlewares.${APP_NAME:-manaresto}-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.${APP_NAME:-manaresto}-https-redirect.redirectscheme.permanent=true"
      - "traefik.http.routers.${APP_NAME:-manaresto}.rule=Host(`${PUBLIC_HOST}`) || Host(`${PUBLIC_HOST_ALT:-${PUBLIC_HOST}}`)"
      - "traefik.http.routers.${APP_NAME:-manaresto}.entrypoints=websecure"
      - "traefik.http.routers.${APP_NAME:-manaresto}.tls=true"
      - "traefik.http.routers.${APP_NAME:-manaresto}.tls.certresolver=letsencrypt"
      - "traefik.http.services.${APP_NAME:-manaresto}.loadbalancer.server.port=3000"
      # Flux SSE : pas de mise en tampon, délais longs
      - "traefik.http.routers.${APP_NAME:-manaresto}.middlewares=${APP_NAME:-manaresto}-headers"
      - "traefik.http.middlewares.${APP_NAME:-manaresto}-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.${APP_NAME:-manaresto}-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.${APP_NAME:-manaresto}-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.${APP_NAME:-manaresto}-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.${APP_NAME:-manaresto}-headers.headers.referrerPolicy=strict-origin-when-cross-origin"

  # Site vitrine (www.manaresto.com) : pages statiques servies par nginx, HTTPS par Traefik
  site:
    image: nginx:1.27-alpine
    container_name: ${APP_NAME:-manaresto}-site
    restart: unless-stopped
    logging: *logging
    volumes:
      - ./site:/usr/share/nginx/html:ro
      # Dossier (et non fichier unique) : un fichier remplacé par rsync resterait figé dans le conteneur
      - ./site/nginx:/etc/nginx/conf.d:ro
    networks:
      - traefik
    mem_limit: ${SITE_MEM_LIMIT:-64m}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.${APP_NAME:-manaresto}-site-http.rule=Host(`${SITE_HOST:-www.manaresto.com}`) || Host(`${SITE_HOST_ALT:-manaresto.com}`)"
      - "traefik.http.routers.${APP_NAME:-manaresto}-site-http.entrypoints=web"
      - "traefik.http.routers.${APP_NAME:-manaresto}-site-http.middlewares=${APP_NAME:-manaresto}-site-https"
      - "traefik.http.middlewares.${APP_NAME:-manaresto}-site-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.${APP_NAME:-manaresto}-site-https.redirectscheme.permanent=true"
      - "traefik.http.routers.${APP_NAME:-manaresto}-site.rule=Host(`${SITE_HOST:-www.manaresto.com}`) || Host(`${SITE_HOST_ALT:-manaresto.com}`)"
      - "traefik.http.routers.${APP_NAME:-manaresto}-site.entrypoints=websecure"
      - "traefik.http.routers.${APP_NAME:-manaresto}-site.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${APP_NAME:-manaresto}-site.middlewares=${APP_NAME:-manaresto}-site-www"
      - "traefik.http.middlewares.${APP_NAME:-manaresto}-site-www.redirectregex.regex=^https://${SITE_HOST_ALT:-manaresto.com}/(.*)"
      - "traefik.http.middlewares.${APP_NAME:-manaresto}-site-www.redirectregex.replacement=https://${SITE_HOST:-www.manaresto.com}/$${1}"
      - "traefik.http.middlewares.${APP_NAME:-manaresto}-site-www.redirectregex.permanent=true"
      - "traefik.http.services.${APP_NAME:-manaresto}-site.loadbalancer.server.port=80"

  # Optionnel (plusieurs instances de l'application) : docker compose --profile redis up -d
  redis:
    image: redis:7-alpine
    container_name: ${APP_NAME:-manaresto}-redis
    restart: unless-stopped
    logging: *logging
    profiles: ["redis"]
    # Plafond interne sous la limite du conteneur : les plus anciennes clés partent avant tout débordement
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "${REDIS_MAXMEMORY:-96mb}", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - internal
    mem_limit: ${REDIS_MEM_LIMIT:-128m}

networks:
  traefik:
    external: true
    name: traefik
  internal:
    driver: bridge

volumes:
  pgdata:
